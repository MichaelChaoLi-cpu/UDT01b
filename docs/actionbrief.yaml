figureDictionary:
  fig_study_area_and_urban_flood_computation:
    figureId: fig_study_area_and_urban_flood_computation
    figurePath: data/results/figures/Figure_study_area_and_urban_flood_computation.png
    figureCaption: Study area, urban geometry and surface-water computational representation
    figureAim: Locate the three wards and explain how terrain, water, roads and buildings enter the two-dimensional
      model.
    figureExplanation: Panel a maps the three wards, b locates them in Tokyo, c shows the Hibiya-Marunouchi three-dimensional
      city scene and d the same-area 10 m computational representation. Buildings, roads, terrain and water are
      input context. City geometry constrains two-dimensional surface-water computation; water polygons are not
      channel bathymetry. This figure does not measure superiority over a terrain-only model.
    figureSuitableSection: 'Methods: Study Area and Model'
    publicationRole: main_text
    planTitle: Study Area and Urban Flood Computation
    panelCount: 4
    figurePanelCount: 4
    figureNote: "Panel a maps the three wards, b locates them in Tokyo, c shows the Hibiya-Marunouchi three-dimensional city scene and d the same-area 10 m computational representation. Buildings, roads, terrain and water are input context. City geometry constrains two-dimensional surface-water computation; water polygons are not channel bathymetry. This figure does not measure superiority over a terrain-only model."
    panelLayout: ab/ac/ad
    acceptanceDecision: MILI-D-20261024-049
    sha256: 65cceb5b722a293110589cf9af5baeddeb64e3ffeb4d96e8a2357d4efb2efad5
    analysisScript: src/analyses/figure_study_area_and_urban_flood_computation.py
    fullCaption: Study area, three-dimensional urban information and computational representation. (a) Chiyoda,
      Chuo and Minato, with the frozen terrain, building footprints, ground-road candidates and PLATEAU water footprints;
      adjoining context remains visible. The orange rectangle locates the common Hibiya–Marunouchi detail window.
      (b) The study wards within Tokyo's 23 special wards, using the project's downloaded official N03 administrative
      zones dated 1 January 2024. (c) An elevated depth-tested rendering of actual PLATEAU building surfaces, terrain,
      ground-road candidates and explicit LOD1 water surfaces in the same projected rectangle used in d. Buildings
      are white, roads gray, terrain beige and water pale blue; no facade textures or height exaggeration are used.
      Fine terrain is reduced to five-meter display samples, with missing ground kept absent. Ground-road geometry
      is draped on this terrain with an 0.08-meter drawing offset, not a surveyed carriageway or bridge elevation.
      Original water-surface elevations are retained; these are not independently validated event stages or channel-bed
      elevations. Display terrain intersecting water footprints is omitted solely to expose the water layer, without
      modifying any hydraulic input. (d) The same area on the actual regular ten-meter hydraulic grid. Native bed
      elevations, active support and fully closed building exchange faces are read from an existing frozen urban-constrained
      case; red segments are the actual building-closure input, not guessed flow connections. Source footprints
      remain visual context, not a claim that every subcell building is fully impermeable. Light gray gaps identify
      unsupported or inactive native bed support. The figure explains the implemented framework and introduces no
      new hydraulic run, transport fit, machine-learning training, empirical flood validation or superiority claim
      for three-dimensional information.
  fig_urban_geometry_and_road_disruption:
    figureId: fig_urban_geometry_and_road_disruption
    figurePath: data/results/figures/Figure_urban_geometry_and_road_disruption.png
    figureCaption: Urban geometry sensitivity and five-event road disruption
    figureAim: Describe representation sensitivity alongside whole-area road interruption while preserving distinct
      forcing families.
    figureExplanation: Panels a/b show low/raised-stage conservative urban-minus-terrain cellwise peak-depth contrasts
      for the 2024-08-21 reference-rain geometry family. Panels c/d show 109 simultaneous five-minute road states
      for five other historical radar parents. Panel e pairs nine-hour integrated closure by stage. Panel f is September
      high-stage no-action frame 29, elapsed 2:25. Peak envelopes are not simultaneous inundation; geometry and
      road blocks are not a matched five-event factorial. Closure and restriction are scenario rules at 0.30 and
      0.10 m on fixed admitted road support.
    figureSuitableSection: Results
    publicationRole: main_text
    planTitle: Urban Geometry and Road Disruption
    panelCount: 6
    figurePanelCount: 6
    figureNote: "Panels a/b show low/raised-stage conservative urban-minus-terrain cellwise peak-depth contrasts for the 2024-08-21 reference-rain geometry family. Panels c/d show 109 simultaneous five-minute road states for five other historical radar parents. Panel e pairs nine-hour integrated closure by stage. Panel f is September high-stage no-action frame 29, elapsed 2:25. Peak envelopes are not simultaneous inundation; geometry and road blocks are not a matched five-event factorial. Closure and restriction are scenario rules at 0.30 and 0.10 m on fixed admitted road support."
    panelLayout: ab/cff/dff/eff
    acceptanceDecision: MILI-D-20261025-010
    sha256: 7a00935646ed7aa85e6123a8053fc9515f7b35960dfa45e3129ded51ffce14dc
    analysisScript: src/analyses/figure_urban_geometry_and_road_disruption.py
    fullCaption: Urban geometry sensitivity and road disruption under prescribed rainfall and receiving-water scenarios.
      Panels a and b retain low- and raised-stage conservative urban-minus-terrain differences between cellwise
      peak-depth envelopes from the original 2024-08-21 reference-rain geometry family. Red denotes a strictly positive
      interval contrast, blue a strictly negative contrast, and neutral color includes overlapping numerical bounds.
      The scale saturates at ±0.30 m; these are not simultaneous flood maps. Panels c and d show lower-depth qualified
      closed-road length at 109 simultaneous five-minute states for five historical radar parents, under low and
      raised stages. The shared date legend applies to c and d. Panel e pairs the same nine-hour cumulative exposures
      by stage in kilometer-hours; these are not unique road kilometers. Panel f is the frozen September raised-stage
      no-action peak-closure anchor, frame 29, elapsed 2:25. Open by rule means mapped lower depth below 0.10 m,
      restricted at least 0.10 m but below 0.30 m, and closed at least 0.30 m; structural or hazard unknowns remain
      separately mapped. The 836.958 km qualified road denominator and 277.920 km unknown exposure are unchanged.
      The geometry maps and five-parent road analysis are distinct experimental blocks, not a same-event geometry-to-road
      factorial or evidence of observed accuracy superiority. All histories start dry and retain assumed receiving-water
      stages. Closure persists at the nine-hour endpoint, so full recovery is unobserved. No new simulation, routing,
      fitting, training or source adjustment is performed.
  fig_physical_measure_deployment_and_road_effects:
    figureId: fig_physical_measure_deployment_and_road_effects
    figurePath: data/results/figures/Figure_physical_measure_deployment_and_road_effects.png
    figureCaption: Hypothetical local measures and changes in road closure
    figureAim: Connect the original local barrier, drainage and combined response to its frozen hypothetical deployment.
    figureExplanation: Panels a-d show simultaneous no-action closed-road length minus each treatment, for June
      and September under both stages; positive means less closure and negative means deterioration. Panel e maps
      the original 19 hypothetical intakes, 696 overtoppable barrier faces, 4.74 km target corridor and prescribed
      receivers. The 9.5 m3/s nominal ceiling is distinct from the later five-pool allowance experiments. Positions
      and transfer links are hypothetical; receiving storage, sewer response, equipment and engineering feasibility
      are unvalidated.
    figureSuitableSection: Results
    publicationRole: main_text
    planTitle: Physical Measure Deployment and Road Effects
    panelCount: 5
    figurePanelCount: 5
    figureNote: "Panels a-d show simultaneous no-action closed-road length minus each treatment, for June and September under both stages; positive means less closure and negative means deterioration. Panel e maps the original 19 hypothetical intakes, 696 overtoppable barrier faces, 4.74 km target corridor and prescribed receivers. The 9.5 m3/s nominal ceiling is distinct from the later five-pool allowance experiments. Positions and transfer links are hypothetical; receiving storage, sewer response, equipment and engineering feasibility are unvalidated."
    panelLayout: aee/bee/cee/dee
    acceptanceDecision: MILI-D-20261024-022
    sha256: 51c3b75dfeda5fd4fa051610b1faebc9972e7a0d1b13c03854cea12ee4da6cad
    analysisScript: src/analyses/figure_physical_measure_deployment_and_road_effects.py
    fullCaption: 'Local hypothetical deployment and road-closure effects. Panels a-d show simultaneous no-measure
      minus treatment closed-road length for 18 June 2024 at low and raised stage, then 11 September 2025 at low
      and raised stage. Orange dashed, blue dotted and green dash-dot lines indicate barrier, drainage and combined
      arms. Positive values indicate fewer closed kilometers; negative values indicate more. Same-time aggregate
      net reduction is not individual restored-road length or a difference between separately timed peaks. All panels
      use unchanged 0.30 m closure rules, the lower depth branch, native clocks, 109 sampled states and 836.958
      km qualified road support, with 277.920 km unknown exposure separate. Panel e maps the shared frozen local
      deployment: 118 target source roads totaling 4.743 ward-clipped km; 696 ten-meter barrier faces totaling 6.96
      km; nineteen hypothetical intakes; saved prescribed-stage receiving cells; assumed direct transfer links;
      and contextual PLATEAU water bodies. Road and structure lengths describe different objects. Map links are
      not surveyed pipes or hose routes; symbol widths and point sizes are enlarged for visibility, not physical
      dimensions. Each intake has capacity at most 0.5 cubic meters per second, totaling a nominal ceiling of 9.5,
      with 0.05 m trigger, 5 m lift cutoff and prior-storage constraints. Barriers stand 0.5 m above sampled static
      face ground, permit overtopping with coefficient 0.6 and retain existing road-crossing openings. Barrier arms
      enable the mapped barriers; drainage arms enable the pumps; combined arms enable both using the same locations.
      The map depicts treatment inputs, not the area benefiting from treatment. The original sixteen states comprise
      four reused no-measure and twelve treatment histories. The September parent supplied prior corridor-selection
      context; June is a limited transfer check. River storage, downstream capacity, actual construction feasibility
      and event-time traffic congestion are unvalidated. Dry starts and nine-hour end-window censoring remain. All
      values and locations are unchanged; no hydraulic simulation, routing or model fitting is added.'

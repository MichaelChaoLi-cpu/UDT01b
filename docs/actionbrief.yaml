scopeAndUnitSafeguards:
- Observed radar intensity is forcing, not observed inundation.
- Assumed receiving stages and capacities are distinct from measured river hydrographs or installed pumps.
- Five historical parents were development-inspected; they are not untouched independent test events.
- Native cell states, clipped road km, km h, resident stocks, resident h, vehicle proxies and generalized cost must
  not be pooled into one affected-person number.
- A repeated stage, frame, interval endpoint or reused baseline does not increase the number of independent rain
  parents.
- No new hydraulic simulation, routing, traffic fit, training or sealed-test access was performed for this dictionary.

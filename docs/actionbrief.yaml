analysisStructureBrief:
  overview: A conditional whole-area study of extreme-rain road disruption, vehicle accessibility and nighttime
    resident-stock access in Chiyoda, Chuo and Minato. Existing numerically qualified scenarios compare terrain/urban
    representation, a local physical-measure pilot, earlier allocation/placement and a later receiving-allowance
    contrast. Road and resident evidence spans three inspected allowance parents; fitted follow-on traffic spans
    September only. No observed historical-impact reconstruction or new predictive training is claimed.
  levels:
  - levelName: Geographic and urban representation
    levelAim: Establish the physical setting and explain the role of three-dimensional city information.
    inputs:
    - Terrain
    - Urban Geometry
    modelOrMethod: Existing geographic transformations and aligned context maps; preserve native terrain, water
      geometry, building faces and road constraints. Compare a local PLATEAU scene with the same-area 10 m two-dimensional
      computational grid.
    outputs:
    - Study Area and Urban Flood Computation
    - Experimental Design
    interpretation: Context only. Source water geometry does not supply bathymetry and detailed urban geometry is
      not inherently proven more accurate.
  - levelName: Qualified surface-water and geometry comparison
    levelAim: Describe conditional surface-water responses under matched representations and stated receiving stages.
    inputs:
    - Rainfall Forcing
    - Receiving Water Stage
    - Terrain
    - Urban Geometry
    - Surface Water State
    modelOrMethod: Existing version-bound SFINCS 2D surface flow with exact rain-step integration, roof redistribution,
      closed-face enforcement, conservative positivity and independent water budgets. For representation g, H_{k,g}=max_t
      h_{k,g}(t); delta H_k=H_{k,urban}-H_{k,terrain}. Use admitted lower/upper depth bounds and original common
      area weights. Numerical gates include no negative storage, rainfall relative residual <=1e-6, endpoint <=1e-3,
      prefix <=1e-2 with the existing 1 m3 floor, and clock mismatch <=0.001 s.
    outputs:
    - Urban Geometry and Road Disruption
    - Scenario Coverage and Evidence Limits
    interpretation: RQ1 is supported as conditional representation sensitivity on the 2024-08-21 geometry family.
      Peak envelopes are not simultaneous water maps, and the five historical road parents do not make this a crossed
      geometry factorial. Computational checks do not establish observed flood accuracy.
  - levelName: Synchronized road disruption
    levelAim: Translate admitted simultaneous depth into whole-area road interruption and sampled recovery.
    inputs:
    - Road Depth
    - Vehicle Network
    - Closed Road Length
    - Slow Road Length
    - Closed Road Duration
    modelOrMethod: L_m(t)=sum_{e in Q} l_e I[d_{e,m}(t)>=0.30]; S_m(t)=sum_{e in Q} l_e I[0.10<=d_{e,m}(t)<0.30];
      K_m=integral_0^32400 L_m(t)dt/3600 using original trapezoidal sample intervals. Q is the common qualified
      set and l_e is unique three-ward-clipped length in km. Preserve lower/upper branches and the 109 actual-time
      states; display uses checked zero/32400 endpoints.
    outputs:
    - Urban Geometry and Road Disruption
    - Receiving Allowance Road and Resident Effects
    - Cross-Event Allocation and Placement Effects
    interpretation: RQ1 identifies modeled closure and persistence on 836.958 km of qualified roads; 277.920 km
      remains unknown. A 0.30 m closure is a scenario road rule, not an observed closure. End-window recovery is
      censored. Do not substitute peak envelopes or any-time unions for network states.
  - levelName: Matched measures and receiving allowances
    levelAim: Compare local measures and separate allocation, placement and receiving constraints.
    inputs:
    - Measure Configuration
    - Receiving Water Stage
    - Closed Road Length
    - Closed Road Duration
    - Surface Water State
    modelOrMethod: 'At identical parent, stage, time and support compare reference r with treatment m. Restored
      road exposure G is closed under r and open under m; new closure D is open under r and closed under m. K_r-K_m=integral(G-D)dt/3600.
      Keep peak-to-peak, same-time and integrated changes separate. Original pilot: 19 hypothetical 0.5 m3/s units
      and 696 overtoppable faces. Earlier Static/O1/S1: same assumed total 2.5 m3/s, separate 62/319 layouts and
      qualified operators. Later Q2.5/Q5: same 319 locations and allocator; five pool caps 0.5/1.0 m3/s, with unit
      ceiling, trigger, lift and prior-storage limits fixed.'
    outputs:
    - Physical Measure Deployment and Road Effects
    - Receiving Allowance Road and Resident Effects
    - Cross-Event Allocation and Placement Effects
    - Deployment Assumptions and Receiving Limits
    interpretation: RQ4 supports bounded deployment-dependent improvements and adverse/null cases. Equal allowance
      does not mean equal equipment, extraction, cost or energy. Intake locations and receivers are assumptions,
      not official pump actions or validated outlet capacity. Distinct blocks must not be pooled as identical measures.
  - levelName: Candidate-paired resident accessibility
    levelAim: Relate conditional vehicle access to official nighttime stock without imposing building occupancy.
    inputs:
    - Vehicle Network
    - Vehicle Access
    - Resident Population
    - Population Access Candidates
    - Resident Access Loss
    - Paired Resident Benefit
    - New Resident Access Loss
    - Unresolved Resident Stock
    modelOrMethod: For candidate v, loss ell_{v,m}=chi_v(normal)[1-chi_{v,m}], where chi denotes bidirectional portal
      access. Over complete normal-support units i with stock P_i and candidate set S_i, sum P_i min/max_{v in S_i}
      ell for lower/upper loss. Direct benefit uses min/max of ell_{v,r}-ell_{v,m} on the SAME candidates before
      unit aggregation and nine-hour trapezoidal integration. Apply restoration and new-loss binary indicators separately.
      Preserve 0/10/25 m branches; 10 m is primary.
    outputs:
    - Receiving Allowance Road and Resident Effects
    - Resident Access Benefits
    - Adverse Transfer and Coverage
    interpretation: RQ3 and RQ4 support conditional stock-access bounds and directly paired benefits. The official
      496,345 stock and 41,308 unresolved residents stay separate. Resident-hours are not unique affected persons
      or people present. Candidate bounds are not statistical confidence intervals; never subtract marginal loss
      endpoints or rank by their midpoints.
  - levelName: Restricted static vehicle performance
    levelAim: Separate path availability, original requests and cost among the same surviving requests.
    inputs:
    - Vehicle Demand
    - Road Capacity
    - Reference Travel Cost
    - Unreachable Vehicle Requests
    - Common OD Cost
    - Road Depth
    - Measure Configuration
    modelOrMethod: Existing two-path restricted static assignment minimizes sum_a integral_0^{f_a} c_a(u)du, c_a(f)=tau_a[1+0.15(f/C_a)^4],
      over the admitted route pool. Closed arcs are excluded; slow-road tau doubles and C halves. Freeze 2 times
      the original 17:00 driver-request proxy. At 2:25, 4, 6 and 9 hours, preserve all 24 September stage/portfolio
      states and original request conservation. Compute demand-weighted model cost on the identical all-state surviving
      OD cohort; index=100*cost_treatment/cost_same_time_noaction and reduction=100-index. Keep within-time cohorts
      distinct.
    outputs:
    - Transport Benefits and Local Adverse Effects
    - Vehicle Request and Common-Cohort Cost
    interpretation: RQ2/RQ4 show identical represented-request reachability across treatments and cost changes below
      0.4 percent in this scope, with early adverse values retained. Fixed-cohort weight is 26,825.4559 and original
      request proxy 37,113.1985; excluded requests are explicit. This is not dynamic queues, actual delay, calibrated
      event-hour demand or July/August fitted traffic evidence.
  - levelName: Adverse transfer and evidence boundaries
    levelAim: Check deterioration separately from regional net benefits and qualify what can be written.
    inputs:
    - Surface Water State
    - Road Depth
    - Closed Road Length
    - New Resident Access Loss
    - Outside Corridor Depth Increase
    modelOrMethod: At the same admitted cell/time use conservative treatment lower water level minus reference upper
      water level; screen rise >=0.10 m. Compute maximum simultaneous area and any-time union separately on declared
      support, retaining the 0.01 m shallow censor interval only where permitted. Road new-closure screens use original
      0.30 m rules and both depth branches. Pilot outside-corridor depth screens and later head-rise scopes remain
      distinct; maps show explicitly labeled frozen-time or any-time states.
    outputs:
    - Transport Benefits and Local Adverse Effects
    - Adverse Transfer and Coverage
    - Scenario Coverage and Evidence Limits
    interpretation: RQ4 supports explicit modeled side effects without claiming an isolated causal road mechanism
      or receiving-river safety. Head rise, newly wet subsets, new closure and population loss have different definitions.
      Numerical qualification is not observed road inundation or congestion accuracy. Daytime presence, function
      operation, downstream storage and actual stranded-person counts remain unconstructed or unverified.

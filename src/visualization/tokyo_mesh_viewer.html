const canvas=document.getElementById('scene'),gl=canvas.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL unavailable');if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');
const vs=`attribute vec3 aPos;attribute vec3 aNormal;uniform mat4 uMvp;varying vec3 vNormal;varying vec3 vWorld;void main(){gl_Position=uMvp*vec4(aPos,1.0);vNormal=aNormal;vWorld=aPos;}`;const fs=`precision highp float;uniform vec3 uEye;uniform float uLit;uniform float uLine;uniform vec3 uColor;varying vec3 vNormal;varying vec3 vWorld;void main(){vec3 n=normalize(vNormal);if(dot(n,uEye-vWorld)<0.0)n=-n;float d=max(dot(n,normalize(vec3(-0.65,1.0,-0.5))),0.0);float shade=mix(1.0,0.65+0.35*d,uLit);shade=mix(shade,0.63,uLine);gl_FragColor=vec4(uColor*shade,1.0);}`;

const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const d=Math.hypot(...a);return a.map(v=>v/(d||1))};function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}function view(e,t){const z=norm(sub(e,t)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]);}function ortho(w,h){return new Float32Array([2/w,0,0,0,0,2/h,0,0,0,0,-2/6000,0,0,0,-1.00003,1]);}
function make(tris,isLine=false){const out=[];for(const tr of tris){const p=tr.p,n=isLine?[0,1,0]:norm(cross(sub(p[1],p[0]),sub(p[2],p[0])));for(const v of p)out.push(...v,...n);}const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(out),gl.STATIC_DRAW);return {buffer:b,count:out.length/6,primitive:isLine?gl.LINES:gl.TRIANGLES};}const groups={};for(const name of ['terrain','roads','water','buildings'])groups[name]=make(DATA.filter(t=>t.group===name));const roadsOutline=make(LINES,true);const terrainWire=make(DATA.filter(t=>t.group==='terrain').map(t=>({p:[t.p[0],t.p[1],t.p[1],t.p[2],t.p[2],t.p[0]].map(v=>[v[0],v[1]+.035,v[2]])})),true);

for(const name of Object.keys(enabled))document.getElementById(name).onchange=e=>{enabled[name]=e.target.checked;render()};document.getElementById('wire').onchange=e=>{wire=e.target.checked;render()};document.getElementById('reset').onclick=()=>{az=215*Math.PI/180;el=53*Math.PI/180;width=2200;target=[0,65,0];render()};document.getElementById('save').onclick=()=>{render();const a=document.createElement('a');a.download='tokyo_mesh_53394611_clean.png';a.href=canvas.toDataURL('image/png');a.click()};let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;az+=(e.clientX-drag[0])*.006;el=Math.max(.12,Math.min(1.4,el+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];render()};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();width=Math.min(4000,Math.max(200,width*Math.exp(e.deltaY*.001)));render()};addEventListener('resize',render);window.setLayers=(state,note='')=>{for(const [k,v]of Object.entries(state)){if(k==='wire'){wire=v;document.getElementById(k).checked=v}else{enabled[k]=v;document.getElementById(k).checked=v}}render()};window.sceneStats={meshId:META.mesh_id,counts:META.counts,materials:'none',palette:META.palette,language:'en',annotations:'none',heightExaggeration:1};window.setControlsVisible=visible=>document.body.classList.toggle('controls-visible',Boolean(visible));addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!e.ctrlKey&&!e.metaKey&&!e.altKey)window.setControlsVisible(!document.body.classList.contains('controls-visible'));});render();

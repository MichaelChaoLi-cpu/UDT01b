<style>*{box-sizing:border-box}body{margin:0;background:#f4f3ee;font-family:Arial,"PingFang SC",sans-serif;color:#233638;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}header{z-index:10;position:absolute;top:42px;left:48px;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:3px;color:#687e79;font-weight:600}h1{font-size:38px;font-weight:550;margin:12px 0 8px;letter-spacing:2px}header p{margin:0;color:#667976;font-size:14px}nav{z-index:12;position:absolute;right:44px;top:48px;display:flex;gap:8px}button{border:1px solid #bbc8c0;border-radius:24px;background:#f4f3eeeb;padding:10px 16px;color:#36554e;cursor:pointer;font:13px Arial,"PingFang SC",sans-serif}button:hover{background:#e0e9e3}button.active{background:#35594f;color:white;border-color:#35594f}.footer{z-index:10;position:absolute;bottom:28px;left:48px;right:48px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;color:#63746e;font-size:11px;line-height:1.8}.legend{display:flex;gap:16px;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#a4523f}.gray{background:#7d898d}.help{font-size:12px;text-align:right}.export nav,.export .help{display:none}.export header{top:58px;left:68px}.export h1{font-size:46px}.export header p{font-size:16px}.export .eyebrow{font-size:14px}.export .footer{left:68px;right:68px;bottom:38px;font-size:13px}.export .legend{font-size:14px}@media(max-width:600px){header{top:24px;left:22px}h1{font-size:28px}header p{font-size:12px}nav{top:auto;bottom:94px;left:22px;right:auto}.footer{bottom:20px;left:22px;right:22px;display:block;font-size:10px}.help{display:none}.eyebrow{font-size:10px}}
</style><canvas id="scene" aria-label="东京站原始 LOD2 建筑三维模型，可拖动旋转"></canvas><header><div class="eyebrow">TOKYO · MARUNOUCHI</div><h1>东京站 · 三维模型</h1><p>丸之内站舍 / Tokyo Station Marunouchi Building</p></header><nav><button id="context">显示周边街区</button><button id="reset">重置视角</button><button id="save">导出 PNG</button></nav><div class="footer"><div><div class="legend"><span><i class="dot"></i>站舍立面</span><span><i class="dot gray"></i>屋顶与穹顶</span></div><div>Source: PLATEAU · Chiyoda-ku CityGML package 2025 · LOD2<br>原始建筑几何与高度比例 1∶1；配色为示意，地面为展示平面。</div></div><div class="help">拖动旋转 · 滚轮缩放 · 可开启周边模型</div></div>
<script>
const MESH=__MESH_DATA__,META=__MANIFEST__;
const canvas=document.getElementById('scene');const gl=canvas.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL unavailable');
if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');
const vs=`attribute vec3 aPos;attribute vec3 aNormal;attribute vec4 aColor;uniform mat4 uMvp;varying vec3 vNormal;varying vec4 vColor;varying vec3 vWorld;void main(){gl_Position=uMvp*vec4(aPos,1.0);vNormal=aNormal;vColor=aColor;vWorld=aPos;}`;
const fs=`precision highp float;varying vec3 vNormal;varying vec4 vColor;varying vec3 vWorld;uniform float uLit;uniform vec3 uEye;void main(){vec3 n=normalize(vNormal);if(dot(n,uEye-vWorld)<0.0)n=-n;vec3 light=normalize(vec3(-0.60,1.0,-0.45));float diff=max(dot(n,light),0.0);float shade=mix(1.0,0.67+0.37*diff,uLit);gl_FragColor=vec4(vColor.rgb*shade,vColor.a);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const loc={pos:gl.getAttribLocation(program,'aPos'),normal:gl.getAttribLocation(program,'aNormal'),color:gl.getAttribLocation(program,'aColor'),mvp:gl.getUniformLocation(program,'uMvp'),lit:gl.getUniformLocation(program,'uLit'),eye:gl.getUniformLocation(program,'uEye')};
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const d=Math.hypot(...a);return a.map(v=>v/(d||1))};
function matrixMultiply(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}
function lookAt(eye,target){const z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
function ortho(w,h){return new Float32Array([2/w,0,0,0,0,2/h,0,0,0,0,-2/4000,0,0,0,-1.00005,1]);}
function buffer(tris,shadow=false){const values=[];for(const tr of tris){let p=tr.p,n=norm(cross(sub(p[1],p[0]),sub(p[2],p[0])));if(shadow){p=p.map(a=>[a[0]+.60*Math.max(0,a[1]),.055,a[2]+.45*Math.max(0,a[1])]);n=[0,1,0];}for(const v of p)values.push(...v,...n,...(shadow?[.25,.31,.28,.13]:[...tr.c,1]));}const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(values),gl.STATIC_DRAW);return {buffer:b,count:values.length/10};}
const station=buffer(MESH.filter(t=>t.group==='station')),context=buffer(MESH.filter(t=>t.group==='context')),roads=buffer(MESH.filter(t=>t.group==='road')),shadow=buffer(MESH.filter(t=>t.group==='station'),true);
const plane=buffer([{p:[[-900,0,-900],[900,0,-900],[900,0,900]],c:[.957,.953,.929]},{p:[[-900,0,-900],[900,0,900],[-900,0,900]],c:[.957,.953,.929]}]);
let az=205*Math.PI/180,el=38*Math.PI/180,width=460,showContext=false,target=[0,7,0];
function draw(b,lit){gl.bindBuffer(gl.ARRAY_BUFFER,b.buffer);for(const [l,n,off] of [[loc.pos,3,0],[loc.normal,3,12],[loc.color,4,24]]){gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,40,off);}gl.uniform1f(loc.lit,lit);gl.drawArrays(gl.TRIANGLES,0,b.count);}
function render(){const ratio=Math.min(devicePixelRatio,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(.957,.953,.929,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.depthMask(true);const eye=[target[0]+1200*Math.cos(el)*Math.cos(az),target[1]+1200*Math.sin(el),target[2]+1200*Math.cos(el)*Math.sin(az)];gl.uniform3fv(loc.eye,eye);gl.uniformMatrix4fv(loc.mvp,false,matrixMultiply(ortho(width,width/(w/h)),lookAt(eye,target)));draw(plane,0);draw(roads,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);draw(shadow,0);gl.depthMask(true);gl.disable(gl.BLEND);if(showContext)draw(context,1);draw(station,1);window.sceneReady=true;window.lastGlError=gl.getError();}
let drag=null;canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;az+=(e.clientX-drag[0])*.007;el=Math.min(1.35,Math.max(.1,el+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];render()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();width=Math.min(1500,Math.max(160,width*Math.exp(e.deltaY*.001)));render()},{passive:false});
document.getElementById('context').onclick=()=>{showContext=!showContext;width=showContext?1650:460;target=showContext?[0,45,0]:[0,7,0];document.getElementById('context').classList.toggle('active',showContext);document.getElementById('context').textContent=showContext?'隐藏周边街区':'显示周边街区';render()};document.getElementById('reset').onclick=()=>{az=205*Math.PI/180;el=38*Math.PI/180;width=showContext?1650:460;render()};document.getElementById('save').onclick=()=>{render();const a=document.createElement('a');a.download='tokyo_station_model.png';a.href=canvas.toDataURL('image/png');a.click()};addEventListener('resize',render);window.setScene=(a,e,w,ctx=false)=>{document.querySelector('h1').textContent=ctx?'东京站与周边街区':'东京站 · 三维模型';az=a*Math.PI/180;el=e*Math.PI/180;width=w;showContext=ctx;target=ctx?[0,45,0]:[0,7,0];render()};window.sceneStats={stationTriangles:META.station_triangles,buildingCount:META.building_count,totalTriangles:META.triangle_count};render();
</script></html>
